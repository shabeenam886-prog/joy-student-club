<!DOCTYPE html>
<html>

<head>
    <title>Club Feedback</title>
    <link rel="stylesheet" href="pages-style.css">
</head>

<body>

    <div class="page-card">

        <h1>💬 Club Feedback</h1>

        <h2>📝 Share Your Feedback</h2>

        <form onsubmit="showFeedbackMessage(); return false;">

            <label>👤 Member Name:</label><br>
            <input type="text" placeholder="Enter your name" required>
            <br><br>

            <label>🏫 Club Name:</label><br>
            <select required>
                <option value="">Select a club</option>
                <option>Coding Club</option>
                <option>Drama Club</option>
                <option>Music Club</option>
                <option>Sports Club</option>
                <option>Eco Club</option>
            </select>
            <br><br>

            <label>💭 Feedback:</label><br>
            <textarea rows="5" cols="40"
                placeholder="Write your feedback" required></textarea>
            <br><br>

            <button type="submit">📤 Submit Feedback</button>

        </form>

    </div>

    <script>
        function showFeedbackMessage() {
            alert("Thank you for your valuable feedback! 💖");
        }
    </script>

</body>

</html>
