<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Registration</title>
    <link rel="stylesheet" href="pages-style.css">
</head>

<body>

    <div class="page-card">

        <h1>📝 Member Registration</h1>

        <form onsubmit="showThankYou(); return false;">

            <label>👤 Full Name:</label><br>
            <input type="text" placeholder="Enter your name" required>
            <br><br>

            <label>📧 Email:</label><br>
            <input type="email" placeholder="Enter your email" required>
            <br><br>

            <label>📱 Phone Number:</label><br>
            <input type="tel" placeholder="Enter your phone number" required>
            <br><br>

            <label>🏫 Choose Club:</label><br>
            <select required>
                <option value="">Select a club</option>
                <option>💻 Coding Club</option>
                <option>🎭 Drama Club</option>
                <option>🎵 Music Club</option>
                <option>⚽ Sports Club</option>
                <option>🌱 Eco Club</option>
            </select>
            <br><br>

            <label>🎓 Year of Study:</label><br>
            <select required>
                <option value="">Select year</option>
                <option>First Year</option>
                <option>Second Year</option>
                <option>Third Year</option>
                <option>Fourth Year</option>
            </select>
            <br><br>

            <button type="submit">✅ Register</button>

        </form>

    </div>

    <script>
        function showThankYou() {
            alert("Thank you for registering! Your registration has been successfully submitted. 😊");
        }
    </script>

</body>
</html>
